[package]
name = "pack137-news-builder"
# Not the app version. The installer version comes from ../package.json through the
# "version" key in tauri.conf.json, so there is one place to change it.
version = "0.0.0"
description = "Desktop wrapper for the Pack 137 News Builder."
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "pack137_news_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# No plugins, no custom commands, no "devtools" feature.
tauri = { version = "=2.12.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

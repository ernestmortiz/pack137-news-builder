name: Release
# Pushing a version tag (for example v1.0.0) builds the web app and the Windows installer, and
# attaches them to a GitHub release. The web zip works when unzipped and opened from disk, and on
# any static host (spec 3 and 13). Mac volunteers use the web build (owner decision 2026-11-22,
# ADR 0006): current macOS will not run an app that is not notarized by Apple. The Windows
# installer is not signed, so the install guide walks people past the SmartScreen warning. The
# Android build joins this workflow in Phase 8.
#
# Least privilege: the build jobs install and run third-party code (npm packages, Playwright,
# Rust crates) with a read-only token that is not kept on disk. Only the publish job can write,
# and it runs nothing but the GitHub CLI on the finished files. The only secrets are the Android
# signing key (android-sign job, android-release environment) and the Cloudflare token (deploy-web.yml,
# cloudflare-pages environment), each seen by one job that runs only the tool it needs. Nothing is
# cached between runs except the npm download cache that
# setup-node keeps. Actions are pinned to commit SHAs. Files pass from the build jobs to the
# publish job through the Actions cache under keys unique to this run, not as artifacts: the
# cache is outside the account's artifact storage quota, so a full quota cannot stop a release.
# The publish job checks each file against its checksum before attaching it.
on:
  push:
    tags: ['v*.*.*']
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Zip the web build and its checksum
        run: |
          npm run build
          name="pack137-news-builder-${GITHUB_REF_NAME}-web"
          rm -rf release
          mkdir -p "release/${name}"
          cp -r dist/. "release/${name}/"
          cp docs/using-the-web-build.md "release/${name}/HOW-TO-USE.md"
          cp docs/installing-the-desktop-app.md release/INSTALLING-THE-DESKTOP-APP.md
          (cd release && zip -r -q "${name}.zip" "${name}" && sha256sum "${name}.zip" > "${name}.zip.sha256")
          mkdir -p release-web
          mv release/*.zip release/*.zip.sha256 release/INSTALLING-THE-DESKTOP-APP.md release-web/
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: release-web
          key: release-web-${{ github.run_id }}
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi
      - run: npm ci
      # Builds the web app first (beforeBuildCommand), then the NSIS installer. It installs for the
      # current user only, so it needs no administrator password.
      - name: Install the Rust release pinned in src-tauri/rust-toolchain.toml
        run: rustup toolchain install
        working-directory: src-tauri
      # Refuse a Cargo.lock that does not match Cargo.toml, so the build uses only the locked
      # crates, then run the wrapper's own tests. They compile the app, which embeds dist/, so the
      # web build comes first.
      - run: npm run build
      - run: cargo fetch --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: npx tauri build
      - name: Check the built page carries the strict policy
        run: grep -q "connect-src 'none'" dist/index.html
      - name: Name the installer and write its checksum
        run: |
          found="$(find src-tauri/target/release/bundle/nsis -name '*-setup.exe')"
          if [ "$(printf '%s\n' "${found}" | wc -l)" -ne 1 ] || [ -z "${found}" ]; then
            echo "Expected exactly one installer, found:"
            echo "${found}"
            exit 1
          fi
          mkdir -p release-windows
          name="pack137-news-builder-${GITHUB_REF_NAME}-windows-setup.exe"
          cp "${found}" "release-windows/${name}"
          (cd release-windows && sha256sum "${name}" > "${name}.sha256")
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: release-windows
          key: release-windows-${{ github.run_id }}
          enableCrossOsArchive: true
  # Android, in two jobs (Phase 8). The build job runs the third-party build tools with no access
  # to the signing key and hands the unsigned APK on through the cache. The sign job runs only the
  # Android SDK's own zipalign and apksigner, and is the only job that can read the key: it uses
  # the "android-release" environment, whose secrets the owner set up and which only accepts
  # release tags (v*). The key never appears in the repository or in a pull request run.
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi
      - run: npm ci
      - name: Install the Rust release pinned in src-tauri/rust-toolchain.toml, and its Android target
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
        working-directory: src-tauri
      - run: npm run build
      - run: cargo fetch --locked
        working-directory: src-tauri
      # No cargo test here: on Linux the tests compile the desktop app, which needs GTK libraries
      # this job does not install (the v1.1.0 release run failed on it). The same Rust tests run
      # on every release in the windows job and on every wrapper pull request in wrappers.yml.
      - name: Point the Tauri CLI at the runner's Android NDK
        run: echo "NDK_HOME=${ANDROID_NDK_HOME}" >> "${GITHUB_ENV}"
      # Release build, unsigned: no signing config exists in the project.
      - run: npx tauri android build --apk --target aarch64
      - name: Check the built page carries the strict policy
        run: grep -q "connect-src 'none'" dist/index.html
      - name: Hand on the unsigned APK
        run: |
          found="$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk')"
          if [ "$(printf '%s\n' "${found}" | wc -l)" -ne 1 ] || [ -z "${found}" ]; then
            echo "Expected exactly one release APK, found:"
            echo "${found}"
            exit 1
          fi
          mkdir -p release-android-unsigned
          cp "${found}" release-android-unsigned/unsigned.apk
          (cd release-android-unsigned && sha256sum unsigned.apk > unsigned.apk.sha256)
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: release-android-unsigned
          key: release-android-unsigned-${{ github.run_id }}
  android-sign:
    needs: android-build
    runs-on: ubuntu-24.04
    environment: android-release
    permissions:
      contents: read
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: release-android-unsigned
          key: release-android-unsigned-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Check the unsigned APK is the one the build job made
        run: (cd release-android-unsigned && sha256sum --check unsigned.apk.sha256)
      # zipalign, then apksigner with the pack's key. The key file lives only in this step's
      # temporary folder and is deleted at once.
      - name: Sign with the pack's release key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_B64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ]; then
            echo "The android-release environment has no signing key. See docs/release-checklist.md."
            exit 1
          fi
          tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          ks="${RUNNER_TEMP}/pack137-release.p12"
          printf '%s' "${ANDROID_KEYSTORE_B64}" | base64 --decode > "${ks}"
          # A .pfx exported by Windows names its private key after a key container, not the
          # certificate's label, so the v1.1.0 run failed asking for "pack137". Use the file's one
          # private key, whatever it is called.
          alias="$(keytool -list -v -storetype PKCS12 -keystore "${ks}" -storepass:env ANDROID_KEYSTORE_PASSWORD 2>/dev/null \
            | awk '/^Alias name: /{a=substr($0,13)} /^Entry type: PrivateKeyEntry/{print a}' || true)"
          count="$(printf '%s\n' "${alias}" | grep -c . || true)"
          if [ "${count}" != "1" ]; then
            echo "The key file should hold exactly one private key and opened to ${count}. Check the password secret."
            rm -f "${ks}"
            exit 1
          fi
          mkdir -p release-android
          name="pack137-news-builder-${GITHUB_REF_NAME}-android.apk"
          "${tools}/zipalign" -p -f 4 release-android-unsigned/unsigned.apk "${RUNNER_TEMP}/aligned.apk"
          "${tools}/apksigner" sign --ks "${ks}" --ks-type PKCS12 --ks-key-alias "${alias}" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --out "release-android/${name}" "${RUNNER_TEMP}/aligned.apk"
          rm -f "${ks}" "${RUNNER_TEMP}/aligned.apk"
          echo "APK_PATH=release-android/${name}" >> "${GITHUB_ENV}"
      # The same checks as the test build, plus: signed with the pack's key, not a debug key.
      - name: Check permissions, minimum Android version and signature
        run: |
          tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          extra="$("${tools}/aapt2" dump permissions "${APK_PATH}" | grep '^uses-permission' | grep -v 'DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' || true)"
          if [ -n "${extra}" ]; then
            echo "The APK asks for permissions it should not:"
            echo "${extra}"
            exit 1
          fi
          "${tools}/aapt2" dump badging "${APK_PATH}" | grep -E "^(min)?[sS]dkVersion:" | tee sdk.txt
          grep -qE "^(sdkVersion|minSdkVersion):'29'" sdk.txt
          "${tools}/apksigner" verify --verbose --print-certs "${APK_PATH}" | tee certs.txt
          grep -q "CN=Pack 137 News Builder" certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "Signed with a debug key."; exit 1; fi
          (cd release-android && sha256sum "$(basename "${APK_PATH}")" > "$(basename "${APK_PATH}").sha256")
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: release-android
          key: release-android-${{ github.run_id }}
  publish:
    needs: [build, windows, android-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: release-web
          key: release-web-${{ github.run_id }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: release-windows
          key: release-windows-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: release-android
          key: release-android-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Check the checksums
        run: |
          (cd release-web && sha256sum --check ./*.sha256)
          (cd release-windows && sha256sum --check ./*.sha256)
          (cd release-android && sha256sum --check ./*.sha256)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-web/* release-windows/* release-android/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Pack 137 News Builder ${GITHUB_REF_NAME}" \
            --notes "Web build: unzip and open index.html, or put the folder on any web host. See HOW-TO-USE.md inside the zip. Windows installer: the .exe file. Android: the .apk file. On a Mac, use the web build in Safari. The Windows installer is not signed, so Windows shows a warning the first time; on Android, allow installs from your browser or Files app. INSTALLING-THE-DESKTOP-APP.md shows what to click. Each .sha256 file lets you check that its download was not changed. See CHANGELOG.md for what changed."
  # Once the release is published, put its web build on the pack's Cloudflare Pages site. A failure
  # here leaves the release published; fix it and run "Deploy web" by hand for the same tag.
  deploy-web:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-web.yml
    with:
      tag: ${{ github.ref_name }}

name: Release
# Pushing a version tag (for example v1.0.0) builds the web app, the Windows installer and the
# macOS disk image, and attaches them to a GitHub release. The web zip works when unzipped and
# opened from disk, and on any static host (spec 3 and 13). The installers are not signed, so the
# install guide walks people past the Windows and macOS warnings. The Android build joins this
# workflow in Phase 8.
#
# Least privilege: the build jobs install and run third-party code (npm packages, Playwright,
# Rust crates) with a read-only token that is not kept on disk. Only the publish job can write,
# and it runs nothing but the GitHub CLI on the finished files. No signing keys, certificates or
# tokens are used anywhere. Nothing is cached between runs except the npm download cache that
# setup-node keeps. Actions are pinned to commit SHAs (v4).
on:
  push:
    tags: ['v*.*.*']
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Zip the web build and its checksum
        run: |
          npm run build
          name="pack137-news-builder-${GITHUB_REF_NAME}-web"
          rm -rf release
          mkdir -p "release/${name}"
          cp -r dist/. "release/${name}/"
          cp docs/using-the-web-build.md "release/${name}/HOW-TO-USE.md"
          cp docs/installing-the-desktop-app.md release/INSTALLING-THE-DESKTOP-APP.md
          (cd release && zip -r -q "${name}.zip" "${name}" && sha256sum "${name}.zip" > "${name}.zip.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: |
            release/*.zip
            release/*.zip.sha256
            release/INSTALLING-THE-DESKTOP-APP.md
          retention-days: 5
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi
      - run: npm ci
      # Builds the web app first (beforeBuildCommand), then the NSIS installer. It installs for the
      # current user only, so it needs no administrator password.
      - name: Install the Rust release pinned in src-tauri/rust-toolchain.toml
        run: rustup toolchain install
        working-directory: src-tauri
      # Refuse a Cargo.lock that does not match Cargo.toml, so the build uses only the locked
      # crates, then run the wrapper's own tests. They compile the app, which embeds dist/, so the
      # web build comes first.
      - run: npm run build
      - run: cargo fetch --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: npx tauri build
      - name: Check the built page carries the strict policy
        run: grep -q "connect-src 'none'" dist/index.html
      - name: Name the installer and write its checksum
        run: |
          found="$(find src-tauri/target/release/bundle/nsis -name '*-setup.exe')"
          if [ "$(printf '%s\n' "${found}" | wc -l)" -ne 1 ] || [ -z "${found}" ]; then
            echo "Expected exactly one installer, found:"
            echo "${found}"
            exit 1
          fi
          mkdir -p release
          name="pack137-news-builder-${GITHUB_REF_NAME}-windows-setup.exe"
          cp "${found}" "release/${name}"
          (cd release && sha256sum "${name}" > "${name}.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: |
            release/*.exe
            release/*.exe.sha256
          retention-days: 5
  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi
      - run: npm ci
      - name: Install the Rust release pinned in src-tauri/rust-toolchain.toml
        run: rustup toolchain install
        working-directory: src-tauri
      # Inside src-tauri, so the targets are added to the Rust release pinned there.
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
        working-directory: src-tauri
      # One disk image for Apple silicon and Intel Macs. The app is ad-hoc signed ("-" in
      # tauri.conf.json), which is not a certificate. No secrets are involved.
      # Refuse a Cargo.lock that does not match Cargo.toml, so the build uses only the locked
      # crates, then run the wrapper's own tests. They compile the app, which embeds dist/, so the
      # web build comes first.
      - run: npm run build
      - run: cargo fetch --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: npx tauri build --target universal-apple-darwin
      - name: Check the built page carries the strict policy
        run: grep -q "connect-src 'none'" dist/index.html
      - name: Name the disk image and write its checksum
        run: |
          found="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg')"
          if [ "$(printf '%s\n' "${found}" | wc -l)" -ne 1 ] || [ -z "${found}" ]; then
            echo "Expected exactly one disk image, found:"
            echo "${found}"
            exit 1
          fi
          mkdir -p release
          name="pack137-news-builder-${GITHUB_REF_NAME}-macos.dmg"
          cp "${found}" "release/${name}"
          (cd release && shasum -a 256 "${name}" > "${name}.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: |
            release/*.dmg
            release/*.dmg.sha256
          retention-days: 5
  publish:
    needs: [build, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Pack 137 News Builder ${GITHUB_REF_NAME}" \
            --notes "Web build: unzip and open index.html, or put the folder on any web host. See HOW-TO-USE.md inside the zip. Windows installer: the .exe file. Mac: the .dmg file. The installers are not signed, so Windows and macOS show a warning the first time. INSTALLING-THE-DESKTOP-APP.md shows what to click. Each .sha256 file lets you check that its download was not changed. See CHANGELOG.md for what changed."

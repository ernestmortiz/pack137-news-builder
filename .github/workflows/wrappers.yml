name: Wrappers
# Builds the desktop installers on a pull request that touches the wrapper, so the owner can
# download and try them before a tag is pushed. Also checks the real app on Linux with a smoke
# test (see tests/wrapper/smoke.mjs). Nothing here signs anything or uses a secret.
#
# The installers are unsigned test builds. They are published as a draft pre-release named
# "test-build-pr-<number>" (or "test-build-manual"), replaced on every run, which only people with
# write access to the repository can see. Release files do not count against the account's
# artifact storage quota. The build jobs hand the files to the publish job through the Actions
# cache, which is also outside that quota, under a key unique to this run.
#
# They are only built for branches in this repository (or a manual run): a pull request from a
# fork could put anything in an installer, and these are meant to be installed and tried.
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/ui/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tests/wrapper/**'
      - 'scripts/wrapper-smoke.sh'
      - '.github/workflows/wrappers.yml'
  workflow_dispatch:
# Read-only by default: the build jobs install and run third-party code, so their token can
# change nothing. Only the publish job can write, and it runs nothing but the GitHub CLI.
permissions:
  contents: read
jobs:
  linux:
    # Pinned: the smoke test is proven on Ubuntu 24.04. On 26.04 the WebDriver package is named
    # webkitgtk-webdriver instead; move both together, on purpose.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev librsvg2-dev \
            xvfb webkit2gtk-driver
      - run: npm ci
      # Pinned, and built from the locked dependency list of that release.
      - name: Install the Rust release pinned in src-tauri/rust-toolchain.toml
        run: rustup toolchain install
        working-directory: src-tauri
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - run: npm run build
      - name: Unit tests of the download and navigation rules
        run: cargo test --locked
        working-directory: src-tauri
      - name: Smoke test of the real app
        run: scripts/wrapper-smoke.sh
  windows:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the Rust release pinned in src-tauri/rust-toolchain.toml
        run: rustup toolchain install
        working-directory: src-tauri
      # Refuse a Cargo.lock that does not match Cargo.toml, so the build uses only the locked
      # crates, then run the wrapper's own tests. They compile the app, which embeds dist/, so the
      # web build comes first.
      - run: npm run build
      - run: cargo fetch --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: npx tauri build
      - name: Check the built page carries the strict policy
        run: grep -q "connect-src 'none'" dist/index.html
      - name: Name the installer
        run: |
          found="$(find src-tauri/target/release/bundle/nsis -name '*-setup.exe')"
          if [ "$(printf '%s\n' "${found}" | wc -l)" -ne 1 ] || [ -z "${found}" ]; then
            echo "Expected exactly one installer, found:"
            echo "${found}"
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-windows
          name="pack137-news-builder-v${version}-windows-setup.exe"
          cp "${found}" "release-windows/${name}"
          (cd release-windows && sha256sum "${name}" > "${name}.sha256")
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: release-windows
          key: test-installer-windows-${{ github.run_id }}
          enableCrossOsArchive: true
  macos:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the Rust release pinned in src-tauri/rust-toolchain.toml
        run: rustup toolchain install
        working-directory: src-tauri
      # Inside src-tauri, so the targets are added to the Rust release pinned there.
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
        working-directory: src-tauri
      # Refuse a Cargo.lock that does not match Cargo.toml, so the build uses only the locked
      # crates, then run the wrapper's own tests. They compile the app, which embeds dist/, so the
      # web build comes first.
      - run: npm run build
      - run: cargo fetch --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: npx tauri build --target universal-apple-darwin
      - name: Check the built page carries the strict policy
        run: grep -q "connect-src 'none'" dist/index.html
      - name: Name the disk image
        run: |
          found="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg')"
          if [ "$(printf '%s\n' "${found}" | wc -l)" -ne 1 ] || [ -z "${found}" ]; then
            echo "Expected exactly one disk image, found:"
            echo "${found}"
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-macos
          name="pack137-news-builder-v${version}-macos.dmg"
          cp "${found}" "release-macos/${name}"
          (cd release-macos && shasum -a 256 "${name}" > "${name}.sha256")
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: release-macos
          key: test-installer-macos-${{ github.run_id }}
          enableCrossOsArchive: true
  publish:
    needs: [windows, macos]
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: release-windows
          key: test-installer-windows-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: release-macos
          key: test-installer-macos-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Check the checksums
        run: |
          (cd release-windows && sha256sum --check ./*.sha256)
          (cd release-macos && sha256sum --check ./*.sha256)
      # A draft is visible only to people with write access, creates no tag until published, and
      # is never shown to volunteers as the latest release. The previous test build for the same
      # pull request is deleted first, so there is one per pull request.
      - name: Publish the test build as a draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "${PR_NUMBER}" ]; then
            tag="test-build-pr-${PR_NUMBER}"
            title="Test build for pull request #${PR_NUMBER} (not for volunteers)"
          else
            tag="test-build-manual"
            title="Test build from a manual run (not for volunteers)"
          fi
          gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
          gh release create "${tag}" release-windows/* release-macos/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft --prerelease \
            --target "${TARGET}" \
            --title "${title}" \
            --notes "Unsigned test installers built from commit ${TARGET}, for the owner to try before a release (release checklist Step 2c). Not for volunteers. Install steps: docs/installing-the-desktop-app.md. Replaced on the next run."

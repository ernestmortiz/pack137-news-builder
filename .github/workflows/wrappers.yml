name: Wrappers
# Builds the Windows installer and an Android test APK on a pull request that touches the wrapper,
# so the owner can download and try them before a tag is pushed. Also checks the real app on Linux with a smoke
# test (see tests/wrapper/smoke.mjs), and runs the Android app on an emulator (job android-emulator,
# tests/wrapper/android-smoke.mjs). Nothing here signs anything or uses a secret.
#
# The installers are unsigned test builds. The APK is signed with Android's debug key, which the
# Android build makes fresh on each run: no key, keystore or password exists in the repository
# or in any secret, and each test APK has a different signature (uninstall the old one first). They are published as a draft pre-release named
# "test-build-pr-<number>" (or "test-build-manual"), replaced on every run, which only people with
# write access to the repository can see. Closing the pull request deletes its draft
# (cleanup-test-builds.yml). Release files do not count against the account's
# artifact storage quota. The build jobs hand the files to the publish job through the Actions
# cache, which is also outside that quota, under a key unique to this run.
#
# They are only built for branches in this repository (or a manual run): a pull request from a
# fork could put anything in an installer, and these are meant to be installed and tried.
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/ui/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tests/wrapper/**'
      - 'scripts/wrapper-smoke.sh'
      - 'scripts/android-smoke.sh'
      - '.github/workflows/wrappers.yml'
  workflow_dispatch:
# Read-only by default: the build jobs install and run third-party code, so their token can
# change nothing. Only the publish job can write, and it runs nothing but the GitHub CLI.
permissions:
  contents: read
# One run per pull request at a time: a newer push cancels the older run, so two runs never
# replace the same draft at once.
concurrency:
  group: wrappers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    # Pinned: the smoke test is proven on Ubuntu 24.04. On 26.04 the WebDriver package is named
    # webkitgtk-webdriver instead; move both together, on purpose.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev librsvg2-dev \
            xvfb webkit2gtk-driver
      - run: npm ci
      # Pinned, and built from the locked dependency list of that release.
      - name: Install the Rust release pinned in src-tauri/rust-toolchain.toml
        run: rustup toolchain install
        working-directory: src-tauri
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - run: npm run build
      - name: Unit tests of the download and navigation rules
        run: cargo test --locked
        working-directory: src-tauri
      - name: Smoke test of the real app
        run: scripts/wrapper-smoke.sh
  windows:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the Rust release pinned in src-tauri/rust-toolchain.toml
        run: rustup toolchain install
        working-directory: src-tauri
      # Refuse a Cargo.lock that does not match Cargo.toml, so the build uses only the locked
      # crates, then run the wrapper's own tests. They compile the app, which embeds dist/, so the
      # web build comes first.
      - run: npm run build
      - run: cargo fetch --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: npx tauri build
      - name: Check the built page carries the strict policy
        run: grep -q "connect-src 'none'" dist/index.html
      - name: Name the installer
        run: |
          found="$(find src-tauri/target/release/bundle/nsis -name '*-setup.exe')"
          if [ "$(printf '%s\n' "${found}" | wc -l)" -ne 1 ] || [ -z "${found}" ]; then
            echo "Expected exactly one installer, found:"
            echo "${found}"
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-windows
          name="pack137-news-builder-v${version}-windows-setup.exe"
          cp "${found}" "release-windows/${name}"
          (cd release-windows && sha256sum "${name}" > "${name}.sha256")
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release-windows
          key: test-installer-windows-${{ github.run_id }}
          enableCrossOsArchive: true
  android:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    # The Android SDK and NDK come preinstalled on this runner image. The Android build needs
    # Java 17 or later, set explicitly below.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Install the Rust release pinned in src-tauri/rust-toolchain.toml, and its Android target
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
        working-directory: src-tauri
      # Refuse a Cargo.lock that does not match Cargo.toml, so the build uses only the locked
      # crates. The web build comes first because the compiler embeds dist/.
      - run: npm run build
      - run: cargo fetch --locked
        working-directory: src-tauri
      # Gradle downloads, kept between runs so a temporary Maven Central error ("429 Too Many
      # Requests") does not stop a build that already fetched everything once.
      - id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Point the Tauri CLI at the runner's Android NDK
        run: |
          echo "NDK_HOME=${ANDROID_NDK_HOME}" >> "${GITHUB_ENV}"
          echo "Android SDK: ${ANDROID_HOME}"
          echo "Android NDK: ${ANDROID_NDK_HOME}"
          java -version
      # One ABI: arm64-v8a, which every Android phone made in the last several years uses. Add
      # --target x86_64 for an emulator on a PC (about 5 more minutes). Debug build, signed by
      # Gradle with a throwaway debug key it makes on this runner.
      - name: Build the debug APK (retried on a download error)
        run: |
          for attempt in 1 2 3; do
            if npx tauri android build --debug --apk --target aarch64; then exit 0; fi
            if [ "${attempt}" -lt 3 ]; then
              echo "::warning::Gradle build failed (attempt ${attempt} of 3), often a temporary download error. Waiting, then trying again."
              sleep $((attempt * 45))
            fi
          done
          echo "::error::The Gradle build failed 3 times."
          exit 1
      - name: Check the built page carries the strict policy
        run: grep -q "connect-src 'none'" dist/index.html
      - name: Name the APK
        run: |
          found="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk')"
          if [ "$(printf '%s\n' "${found}" | wc -l)" -ne 1 ] || [ -z "${found}" ]; then
            echo "Expected exactly one APK, found:"
            echo "${found}"
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-android
          name="pack137-news-builder-v${version}-android-test.apk"
          cp "${found}" "release-android/${name}"
          echo "APK_PATH=release-android/${name}" >> "${GITHUB_ENV}"
          (cd release-android && sha256sum "${name}" > "${name}.sha256")
      # The app must ask Android for nothing. The only permission allowed is the one that the
      # AndroidX libraries add to every app, which only this app can hold. It also must install on
      # Android 10 (API 29) and be signed with the debug key, not anything else.
      - name: Check the APK permissions, minimum Android version and signing key
        run: |
          tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          echo "Build tools: ${tools}"
          "${tools}/aapt2" dump permissions "${APK_PATH}"
          extra="$("${tools}/aapt2" dump permissions "${APK_PATH}" | grep '^uses-permission' | grep -v 'DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' || true)"
          if [ -n "${extra}" ]; then
            echo "The APK asks for permissions it should not:"
            echo "${extra}"
            exit 1
          fi
          # Newer build tools print minSdkVersion; older ones sdkVersion. Either must say 29.
          "${tools}/aapt2" dump badging "${APK_PATH}" | grep -E "^(min)?[sS]dkVersion:" | tee sdk.txt
          grep -qE "^(sdkVersion|minSdkVersion):'29'" sdk.txt
          "${tools}/apksigner" verify --print-certs "${APK_PATH}" | tee certs.txt
          grep -q "CN=Android Debug" certs.txt
      # JVM unit tests of the file name rules MainActivity uses to save into Downloads. They are
      # the Kotlin copy of the Rust tests in src-tauri/src/lib.rs. They run after the build because
      # the Android project needs the files the build generates.
      - name: Unit tests of the Android save rules (retried on a download error)
        run: |
          for attempt in 1 2 3; do
            if ./gradlew :app:testArm64DebugUnitTest; then exit 0; fi
            if [ "${attempt}" -lt 3 ]; then
              echo "::warning::Gradle build failed (attempt ${attempt} of 3), often a temporary download error. Waiting, then trying again."
              sleep $((attempt * 45))
            fi
          done
          echo "::error::The Gradle build failed 3 times."
          exit 1
        working-directory: src-tauri/gen/android
      - if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release-android
          key: test-installer-android-${{ github.run_id }}
  # The release gate for Android (the owner has no Android phone to try it on). It builds an x86_64
  # debug APK from the same source, starts an emulator, installs the app, and drives its WebView
  # through the Chrome DevTools Protocol (tests/wrapper/android-smoke.mjs). It fails on any FAIL.
  # The only difference from the shipped test APK is the CPU type, so the emulator can run it.
  # API 34 is the gate. API 29 (the oldest supported) is informational: its emulator image comes
  # with a Chromium 74 WebView that cannot be updated here, much older than any phone that still
  # gets updates, so a failure there says what an unupdated WebView does, not that the app is wrong.
  # The API 29 test step may fail and the entry still reports success, with a warning that says
  # so (a permanent red mark teaches people to ignore red). The job-level continue-on-error stays
  # so that a real problem on API 29, such as a failed build, cannot block the publish job.
  android-emulator:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ matrix.informational }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 34
            informational: false
          - api-level: 29
            informational: true
    steps:
      # The runner's disk is small: the Rust and Gradle build plus an emulator image fill it
      # ("No space left on device" on the first run). Remove large preinstalled tools this job
      # never uses, and log what is free.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk/2[0-6]* || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Install the Rust release pinned in src-tauri/rust-toolchain.toml, and the emulator's target
        run: |
          rustup toolchain install
          rustup target add x86_64-linux-android
        working-directory: src-tauri
      - run: npm run build
      - run: cargo fetch --locked
        working-directory: src-tauri
      # Gradle downloads, kept between runs so a temporary Maven Central error ("429 Too Many
      # Requests") does not stop a build that already fetched everything once.
      - id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Point the Tauri CLI at the runner's Android NDK
        run: echo "NDK_HOME=${ANDROID_NDK_HOME}" >> "${GITHUB_ENV}"
      - name: Build the x86_64 debug APK (retried on a download error)
        run: |
          for attempt in 1 2 3; do
            if npx tauri android build --debug --apk --target x86_64; then exit 0; fi
            if [ "${attempt}" -lt 3 ]; then
              echo "::warning::Gradle build failed (attempt ${attempt} of 3), often a temporary download error. Waiting, then trying again."
              sleep $((attempt * 45))
            fi
          done
          echo "::error::The Gradle build failed 3 times."
          exit 1
      - if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Name the APK
        run: |
          found="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk')"
          if [ "$(printf '%s\n' "${found}" | wc -l)" -ne 1 ] || [ -z "${found}" ]; then
            echo "Expected exactly one APK, found:"
            echo "${found}"
            exit 1
          fi
          cp "${found}" emulator-test.apk
      # The APK is copied out, so the build folders are no longer needed: free their space for the
      # emulator image. The Gradle cache was saved right after the build, before this deletes it.
      - name: Remove build output before starting the emulator
        run: |
          rm -rf src-tauri/target src-tauri/gen/android/app/build src-tauri/gen/android/build ~/.gradle/caches
          df -h /
      # The emulator needs the machine's virtualization device, which is off for ordinary users on
      # these runners until this rule is added (from the emulator action's documentation).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # v2.38.0. Each line of "script" is a separate command, so the work is in one script file.
      - name: Test the app on an emulator
        id: emulator
        # Only the informational Android 10 entry may fail without failing this step. Android 14
        # is the gate: its failure fails the job.
        continue-on-error: ${{ matrix.informational }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/android-smoke.sh emulator-test.apk
      # Android 10 cannot pass (see the comment above the job), so its entry reports success and says
      # the result as an annotation on the run page instead of a red mark.
      - name: Report the informational result
        if: matrix.informational && steps.emulator.outcome != 'skipped'
        env:
          OUTCOME: ${{ steps.emulator.outcome }}
          API_LEVEL: ${{ matrix.api-level }}
        run: |
          if [ "${OUTCOME}" = "success" ]; then
            echo "::warning title=Android ${API_LEVEL} emulator (informational)::The checks passed on this old web view. Not a gate; nothing to do."
          else
            echo "::warning title=Android ${API_LEVEL} emulator (informational)::The checks did not pass, as expected: the 2019 web view in this emulator image cannot run the app. Not a gate. See the log of the step Test the app on an emulator."
          fi
  publish:
    needs: [windows, android, android-emulator]
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release-windows
          key: test-installer-windows-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release-android
          key: test-installer-android-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Check the checksums
        run: |
          (cd release-windows && sha256sum --check ./*.sha256)
          (cd release-android && sha256sum --check ./*.sha256)
      # A draft is visible only to people with write access, creates no tag until published, and
      # is never shown to volunteers as the latest release. The previous test build for the same
      # pull request is deleted first, so there is one per pull request.
      - name: Publish the test build as a draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "${PR_NUMBER}" ]; then
            tag="test-build-pr-${PR_NUMBER}"
            title="Test build for pull request #${PR_NUMBER} (not for volunteers)"
          else
            tag="test-build-manual"
            title="Test build from a manual run (not for volunteers)"
          fi
          gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --yes || true
          gh release create "${tag}" release-windows/* release-android/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft --prerelease \
            --target "${TARGET}" \
            --title "${title}" \
            --notes "Unsigned test installer (.exe) and Android test app (.apk, debug-signed) built from commit ${TARGET}, for the owner to try before a release (release checklist Step 2c). Not for volunteers. Each .apk is signed with a new throwaway key, so uninstall the earlier test app before installing the next one. Install steps for Windows: docs/installing-the-desktop-app.md. Replaced on the next run."

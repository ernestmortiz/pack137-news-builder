name: Deploy web
# Puts a released version of the web build on the pack's Cloudflare Pages site
# (pack137-news-builder.pages.dev). The release workflow calls this after it publishes a release,
# and the owner can run it by hand from the Actions tab for any release tag (for example to put
# v1.1.0 up the first time, or to roll back). Only released tags are ever deployed, never main.
#
# The build job checks out the tag's app code and the hosting headers from this workflow's own
# revision (scripts/pages-headers.mjs), so a fix to the headers also applies when an older release
# is deployed. It has no secrets. The deploy job is the only one that sees the Cloudflare token: it
# runs in the cloudflare-pages environment (tags v* and the main branch only) and runs nothing but
# Cloudflare's own Wrangler, pinned to one version, on the finished folder. Files pass between the
# jobs through the Actions cache, as in the release workflow.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to deploy, for example v1.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, for example v1.1.0
        required: true
        type: string
permissions: {}
concurrency:
  group: deploy-web
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the tag looks like a release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Only release tags like v1.1.0 can be deployed, not '${TAG}'."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: app
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Check the tag matches package.json
        working-directory: app
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match package.json version ${version}."
            exit 1
          fi
      - name: Build the web app
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Add the hosting headers
        run: |
          node tools/scripts/pages-headers.mjs app/dist
          cat app/dist/_headers
          grep -q "frame-ancestors 'self'" app/dist/_headers
          grep -q "connect-src 'none'" app/dist/_headers
          mkdir -p site
          cp -r app/dist/. site/
          (cd site && find . -type f -print0 | sort -z | xargs -0 sha256sum) > site.sha256
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            site
            site.sha256
          key: deploy-web-${{ github.run_id }}-${{ github.run_attempt }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://pack137-news-builder.pages.dev
    permissions: {}
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            site
            site.sha256
          key: deploy-web-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Check the folder is the one the build job made
        run: (cd site && sha256sum --check --quiet ../site.sha256)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "The cloudflare-pages environment is missing its secrets. See docs/release-checklist.md."
            exit 1
          fi
          npx --yes wrangler@4.158.0 pages deploy site --project-name pack137-news-builder \
            --branch main --commit-message "${TAG}" --commit-dirty=true

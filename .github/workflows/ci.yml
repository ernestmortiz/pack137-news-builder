name: CI
on:
  push:
  pull_request:
# Read-only: CI installs and runs third-party code, so its token can change nothing.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # The same browser tests again, served with the hosted site's headers (scripts/pages-headers.mjs).
      - run: npm run e2e:pages
      # The build step above is the gate. The upload is a convenience and shares the
      # account-wide artifact quota, so a full quota must not fail the check.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: web-build
          path: dist
          retention-days: 1

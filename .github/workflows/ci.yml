name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The build step above is the gate. The upload is a convenience and shares the
      # account-wide artifact quota, so a full quota must not fail the check.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: web-build
          path: dist
          retention-days: 5

name: CI
on:
  push:
  pull_request:
# Read-only: CI installs and runs third-party code, so its token can change nothing.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # The same browser tests again, served with the hosted site's headers (scripts/pages-headers.mjs).
      - run: npm run e2e:pages
      # The build step above is the gate. The upload is a convenience and shares the
      # account-wide artifact quota, so a full quota must not fail the check.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: web-build
          path: dist
          retention-days: 1
